name: Build CV
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"
      - name: Build designed CV
        run: typst compile main.typ cv.pdf --font-path assets/fonts
      - name: Build ATS variant
        run: typst compile main-ats.typ cv-ats.pdf --font-path assets/fonts
      - name: Build preview image
        run: typst compile main.typ cv-preview.png --font-path assets/fonts --ppi 200
      - uses: actions/upload-artifact@v4
        with:
          name: cv
          path: |
            cv.pdf
            cv-ats.pdf
      - uses: softprops/action-gh-release@v1
        if: github.ref_type == 'tag'
        with:
          files: |
            cv.pdf
            cv-ats.pdf
            cv-preview.png
      - name: Check out website repo
        if: github.ref_type == 'tag'
        uses: actions/checkout@v4
        with:
          repository: thibaudledent/thibaudledent.github.io
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: website

      - name: Publish CV to website repo
        if: github.ref_type == 'tag'
        run: |
          mkdir -p website/assets
          cp cv.pdf website/assets/Thibaud-Ledent-CV.pdf
          cp cv-preview.png website/assets/
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Thibaud-Ledent-CV.pdf assets/cv-preview.png
          git diff --staged --quiet || git commit -m "Update CV (${{ github.ref_name }})"
          git push
